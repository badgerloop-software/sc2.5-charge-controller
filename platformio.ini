[platformio]
default_envs = stm32f373c8

[env:stm32f373c8]
platform = ststm32@19.7.1
board = custom_stm32f373c8
framework = arduino
board_build.ldscript = linker/stm32f373c8.ld
lib_extra_dirs = ./embedded-pio
upload_protocol = stlink
debug_tool = stlink

